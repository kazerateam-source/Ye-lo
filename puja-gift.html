<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Puja 💖</title>
<style>
:root{--ink:#4a1030;--rose:#ff4d8d;--bg1:#ffd9e8;--bg2:#ffb3d1;--bg3:#d9a7ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);overflow:hidden;
background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-size:200% 200%;animation:bg 12s ease-in-out infinite;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@keyframes bg{50%{background-position:100% 100%}}
.fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fl i{position:absolute;top:-50px;font-style:normal;opacity:.9;animation:fall linear forwards;will-change:transform}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(540deg);opacity:.7}}
.fl b{position:absolute;left:50%;top:52%;font-weight:400;animation:burst 1.6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(1.4) rotate(300deg);opacity:0}}
.sc{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;transition:opacity .9s,transform .9s}
.sc.off{opacity:0;transform:scale(.92);pointer-events:none}
h1{font-size:clamp(34px,9vw,64px);font-weight:700;letter-spacing:.01em;text-shadow:0 4px 24px rgba(255,255,255,.7)}
.cur:after{content:"|";margin-left:2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#gift{background:none;border:0;cursor:pointer;font-size:clamp(110px,32vw,170px);line-height:1;filter:drop-shadow(0 16px 24px rgba(180,30,90,.35));animation:bob 2.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
#gift:active{transform:scale(.94)}
#gift.go{animation:pop .8s forwards}
@keyframes bob{50%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes pop{30%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(0);opacity:0}}
.hint{font-size:16px;opacity:.75;animation:bl 1.8s ease-in-out infinite}
.card{max-width:560px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:34px 26px;box-shadow:0 24px 60px -20px rgba(180,30,90,.45)}
#msg{font-size:clamp(22px,5.6vw,32px);line-height:1.5;font-style:italic}
.heart{font-size:40px;margin-bottom:10px;display:block;animation:hb 1.2s ease-in-out infinite}@keyframes hb{50%{transform:scale(1.2)}}
#again{margin-top:20px;background:var(--rose);color:#fff;border:0;border-radius:99px;padding:11px 22px;font:inherit;font-size:15px;cursor:pointer;opacity:0;transition:opacity 1s;box-shadow:0 8px 20px rgba(255,77,141,.4)}
#again.on{opacity:1}
#mu{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:5;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(180,30,90,.25)}#mu[hidden]{display:none}
@media(prefers-reduced-motion:reduce){body,#gift,.heart,.hint{animation:none}}
</style></head><body>
<div class="fl" id="fl" aria-hidden="true"></div>
<button id="mu" hidden aria-label="Music on/off">🔊</button>

<section class="sc" id="s1">
  <h1 id="hi" class="cur"></h1>
  <button id="gift" aria-label="Open your gift">🎁</button>
  <p class="hint">Gift ta click koro</p>
</section>

<section class="sc off" id="s2">
  <div class="card"><span class="heart">💖</span><p id="msg"></p>
  <button id="again">Abar dekhibo 🎁</button></div>
</section>

<script>
const $=s=>document.querySelector(s),fl=$("#fl"),E=["🌸","🌹","🌷","🌺","💮","🌼","💖","🌸"],
RM=matchMedia("(prefers-reduced-motion:reduce)").matches,
HI="Puja ki korisa?",
MSG="tumak kimn val pau tumi ki bujiba sob misa kuwa buli a vaba";
const pick=()=>E[Math.random()*E.length|0];
function petal(){const p=document.createElement("i");p.textContent=pick();
 p.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*24}px;animation-duration:${5+Math.random()*6}s;--dx:${Math.random()*180-90}px`;
 fl.appendChild(p);setTimeout(()=>p.remove(),12000)}
function burst(n){for(let i=0;i<n;i++){const b=document.createElement("b"),a=Math.random()*6.283,d=120+Math.random()*220;
 b.textContent=pick();b.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;font-size:${20+Math.random()*20}px`;
 fl.appendChild(b);setTimeout(()=>b.remove(),1800)}}
function type(el,t,ms,done){el.textContent="";let i=0;(function n(){el.textContent=t.slice(0,++i);i<=t.length?setTimeout(n,ms):done&&done()})()}

let soft=setInterval(petal,RM?2500:1100),heavy;
function intro(){
 $("#s2").classList.add("off");$("#s1").classList.remove("off");
 $("#gift").classList.remove("go");$("#again").classList.remove("on");
 $("#gift").style.display="";document.querySelector(".hint").style.visibility="hidden";
 $("#hi").classList.add("cur");
 type($("#hi"),HI,90,()=>{$("#hi").classList.remove("cur");document.querySelector(".hint").style.visibility="visible"});
 clearInterval(heavy);
}
$("#gift").onclick=()=>{
 $("#gift").classList.add("go");burst(RM?8:34);
 for(let i=0;i<(RM?6:30);i++)setTimeout(petal,i*60);
 heavy=setInterval(petal,RM?700:170);
 setTimeout(()=>{$("#s1").classList.add("off");$("#s2").classList.remove("off");
  $("#msg").classList.add("cur");
  type($("#msg"),MSG,70,()=>{$("#msg").classList.remove("cur");$("#again").classList.add("on");burst(RM?4:16)})},900)};
/* romantic music: soft music-box + pad, generated live (no audio file) */
let ac,mg,nt=0,st=0,tm,on=false;
const mb=$("#mu"),F=n=>440*2**((n-69)/12),
CH=[[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69]],BS=[48,43,45,41],PAT=[0,1,2,3,2,1,3,2];
function note(f,t,ty,v,d,at=.01){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g).connect(mg);o.start(t);o.stop(t+d+.05)}
function beat(s,t){const k=(s>>3)%4,c=CH[k],i=s%8;
 note(F(c[PAT[i]]),t,"triangle",.11,1.6);
 if(i==0){note(F(BS[k]),t,"sine",.18,3.4,.08);c.slice(0,3).forEach(m=>note(F(m-12),t,"sine",.04,3.6,.5))}
 if((i==0||i==4||i==6)&&Math.random()<.8)note(F(c[Math.random()*4|0]+12),t+.02,"sine",.07,2.2)}
function tick(){while(nt<ac.currentTime+.4){beat(st++,nt);nt+=.46}tm=setTimeout(tick,120)}
function play(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=0;
 const d=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter();d.delayTime.value=.42;fb.gain.value=.4;lp.type="lowpass";lp.frequency.value=2200;
 mg.connect(ac.destination);mg.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(ac.destination)}
 ac.resume();nt=ac.currentTime+.1;clearTimeout(tm);tick();
 mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setValueAtTime(mg.gain.value,ac.currentTime);mg.gain.linearRampToValueAtTime(.8,ac.currentTime+2);
 on=true;mb.hidden=false;mb.textContent="🔊"}
function stop(){on=false;mg.gain.cancelScheduledValues(ac.currentTime);mg.gain.setValueAtTime(mg.gain.value,ac.currentTime);mg.gain.linearRampToValueAtTime(0,ac.currentTime+.6);
 setTimeout(()=>{if(!on)clearTimeout(tm)},700);mb.textContent="🔇"}
mb.onclick=()=>on?stop():play();
addEventListener("pointerdown",e=>{if(!ac&&e.target!==mb)play()});
document.addEventListener("visibilitychange",()=>{if(!ac)return;document.hidden?ac.suspend():on&&ac.resume()});
$("#again").onclick=intro;
intro();
</script></body></html>
